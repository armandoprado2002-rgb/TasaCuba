          mkdir -p app/src/main/java/com/example/tasacuba
          cat > app/src/main/java/com/example/tasacuba/RatesVM.kt <<'EOF'
          package com.example.tasacuba

          import android.app.Application
          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.Network
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          data class Rates(val usd: Double?, val eur: Double?, val mlc: Double?, val updatedAt: Long)

          class RatesVM(app: Application) : AndroidViewModel(app) {

              private val ctx: Context = app.applicationContext
              private val prefs = ctx.getSharedPreferences("tasa_cuba", Context.MODE_PRIVATE)
              private val client = OkHttpClient.Builder()
                  .connectTimeout(12, TimeUnit.SECONDS)
                  .readTimeout(12, TimeUnit.SECONDS)
                  .build()

              var token by mutableStateOf(prefs.getString("token", "") ?: "")
                  private set
              var rates by mutableStateOf<Rates?>(loadCached())
                  private set
              var loading by mutableStateOf(false)
                  private set
              var error by mutableStateOf<String?>(null)
                  private set
              var online by mutableStateOf(false)
                  private set

              private val cm = ctx.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
              private var lastAuto = 0L

              private val netCallback = object : ConnectivityManager.NetworkCallback() {
                  override fun onAvailable(network: Network) {
                      online = true
                      val now = System.currentTimeMillis()
                      // evita ráfagas de reintentos si la señal parpadea
                      if (now - lastAuto > 20_000) {
                          lastAuto = now
                          refresh()
                      }
                  }

                  override fun onLost(network: Network) {
                      online = cm.activeNetwork != null
                  }
              }

              init {
                  online = cm.activeNetwork != null
                  cm.registerDefaultNetworkCallback(netCallback)
                  if (token.isNotBlank() && (rates == null || isStale())) refresh()
              }

              private fun isStale(): Boolean {
                  val r = rates ?: return true
                  return System.currentTimeMillis() - r.updatedAt > 6 * 60 * 60 * 1000L
              }

              fun setToken(t: String) {
                  token = t.trim()
                  prefs.edit().putString("token", token).apply()
                  error = null
                  if (token.isNotBlank()) refresh()
              }

              private fun loadCached(): Rates? {
                  val t = prefs.getLong("updated_at", -1L)
                  if (t < 0) return null
                  val usd = prefs.getFloat("usd", -1f).let { if (it < 0) null else it.toDouble() }
                  val eur = prefs.getFloat("eur", -1f).let { if (it < 0) null else it.toDouble() }
                  val mlc = prefs.getFloat("mlc", -1f).let { if (it < 0) null else it.toDouble() }
                  return Rates(usd, eur, mlc, t)
              }

              private fun saveCached(r: Rates) {
                  prefs.edit()
                      .putLong("updated_at", r.updatedAt)
                      .putFloat("usd", (r.usd ?: -1.0).toFloat())
                      .putFloat("eur", (r.eur ?: -1.0).toFloat())
                      .putFloat("mlc", (r.mlc ?: -1.0).toFloat())
                      .apply()
              }

              fun refresh() {
                  if (token.isBlank()) {
                      error = "Falta el token de elToque"
                      return
                  }
                  if (loading) return
                  viewModelScope.launch {
                      loading = true
                      error = null
                      val result = withContext(Dispatchers.IO) { fetch() }
                      result.onSuccess {
                          rates = it
                          saveCached(it)
                      }.onFailure {
                          error = it.message ?: "No se pudo conectar"
                      }
                      loading = false
                  }
              }

              private fun fetch(): Result<Rates> {
                  return try {
                      val day = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                      val body = JSONObject().apply {
                          put("date_from", day)
                          put("date_to", day)
                      }.toString().toRequestBody("application/json".toMediaType())

                      val req = Request.Builder()
                          .url("https://tasas.eltoque.com/v1/trmi")
                          .addHeader("Authorization", "Bearer $token")
                          .post(body)
                          .build()

                      client.newCall(req).execute().use { resp ->
                          if (!resp.isSuccessful) {
                              val msg = when (resp.code) {
                                  401, 403 -> "El token no es válido"
                                  else -> "El servidor respondió con error ${resp.code}"
                              }
                              return Result.failure(Exception(msg))
                          }
                          val text = resp.body?.string().orEmpty()
                          val root = JSONObject(text)
                          // La respuesta trae una fecha como clave, con un mapa de monedas dentro.
                          val day2 = if (root.length() > 0) root.keys().next() else null
                          val map = when {
                              day2 != null && root.optJSONObject(day2) != null -> root.getJSONObject(day2)
                              root.optJSONObject("tasas") != null -> root.getJSONObject("tasas")
                              else -> root
                          }
                          fun pick(vararg keys: String): Double? {
                              for (k in keys) {
                                  if (map.has(k) && !map.isNull(k)) return map.optDouble(k).takeIf { !it.isNaN() }
                              }
                              return null
                          }
                          val usd = pick("USD")
                          val eur = pick("EUR", "ECU")
                          val mlc = pick("MLC")
                          if (usd == null && eur == null && mlc == null) {
                              return Result.failure(Exception("No reconocí los datos que envió el servidor"))
                          }
                          Result.success(Rates(usd, eur, mlc, System.currentTimeMillis()))
                      }
                  } catch (e: Exception) {
                      Result.failure(Exception("Sin conexión o el servidor no respondió"))
                  }
              }

              override fun onCleared() {
                  cm.unregisterNetworkCallback(netCallback)
                  super.onCleared()
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/tasacuba
          cat > app/src/main/java/com/example/tasacuba/Ui.kt <<'EOF'
