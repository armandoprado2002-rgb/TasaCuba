              }
              val cs = if (dark) base.copy(background = Color.Black, surface = Color.Black) else base
              MaterialTheme(colorScheme = cs, content = content)
          }

          enum class Moneda(val label: String) { USD("Dólar"), EUR("Euro"), MLC("MLC") }

          @Composable
          fun App(vm: RatesVM) {
              val cs = MaterialTheme.colorScheme
              Box(Modifier.fillMaxSize().background(cs.background)) {
